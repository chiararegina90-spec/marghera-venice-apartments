name: SEO cleanup branch validation
on:
  push:
    branches: [seo-cleanup-20260909]
permissions:
  contents: write
jobs:
  cleanup-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-cleanup-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply SEO cleanup
        run: python scripts/seo_cleanup_transform.py
      - name: Validate internal SEO routes
        run: python scripts/seo_cleanup_validate.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit validated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "SEO cleanup site-wide"
            git push origin HEAD:seo-cleanup-20260909
          fi
