name: SEO cleanup branch validation
on:
  push:
    branches: [seo-cleanup-20260909]
permissions:
  contents: read
jobs:
  cleanup-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-cleanup-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate internal SEO routes
        run: python scripts/seo_cleanup_validate.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
