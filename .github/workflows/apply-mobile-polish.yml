name: Apply mobile multilingual polish

on:
  push:
    branches:
      - mobile-multilingual-polish-20260912
    paths:
      - .github/workflows/apply-mobile-polish.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-multilingual-polish-20260912
          fetch-depth: 0

      - name: Apply verified source edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # 1) Language selector: use CH consistently instead of a flag.
          replace_once(
              'components/Header.tsx',
              "const langLabel:Record<Lang,string>={it:'IT',en:'EN',de:'DE',fr:'FR',es:'ES',zh:'🇨🇳'};",
              "const langLabel:Record<Lang,string>={it:'IT',en:'EN',de:'DE',fr:'FR',es:'ES',zh:'CH'};",
          )

          # 2) Restore review parity on DE / FR / ES / ZH apartment pages.
          replace_once(
              'components/LocalizedRich.tsx',
              "import SectionTitle from '@/components/SectionTitle';\n",
              "import SectionTitle from '@/components/SectionTitle';\nimport ReviewSection from '@/components/ReviewSection';\n",
          )

          reviews = r'''const localizedApartmentReviews:Record<Lang,Record<string,{name:string;date:string;text:string}[]>>={
 de:{
  'Rossi Apartment':[
   {name:'Sarah',date:'2026',text:'Die Wohnung war geräumig, makellos sauber und sehr gut ausgestattet. Wir haben den abgeschlossenen Parkplatz und die Bushaltestelle nur wenige Gehminuten entfernt sehr geschätzt. Alessio und Chiara waren freundlich, herzlich und immer erreichbar.'},
   {name:'Giuseppe',date:'Juli 2025',text:'Wir hatten einen fantastischen Aufenthalt. Die Bushaltestelle nach Venedig und der Supermarkt liegen gleich um die Ecke. Die Wohnung bietet alles, was man braucht, und ist sehr gut ausgestattet.'},
   {name:'P (Som)',date:'Oktober 2025',text:'Eine schöne, geräumige Wohnung, besonders praktisch, wenn man mit dem Auto reist. Venedig war mit dem Bus sehr einfach zu erreichen. Chiara war sehr hilfsbereit und hat uns persönlich empfangen.'}
  ],
  'Dimora Castelli':[
   {name:'Semra',date:'März 2026',text:'Die Unterkunft war leicht zu erreichen und die Bushaltestelle liegt ganz in der Nähe. Das Zentrum von Venedig erreichten wir in etwa 15 Minuten. Wir fühlten uns wie zu Hause, und der Parkplatz direkt am Eingang war sehr praktisch.'},
   {name:'Marwa',date:'Januar 2026',text:'Venedig ist mit Bus und Bahn leicht erreichbar. Die Wohnung ist sauber und geräumig, und die Betten sind bequem. Der Empfang war herzlich, mit hilfreichen Informationen und kleinen Aufmerksamkeiten der Gastgeber.'},
   {name:'Lee',date:'April 2026',text:'Alessio und Chiara kennen Venedig sehr gut und gaben uns hilfreiche Tipps zur Orientierung. Die Wohnung ist sehr geräumig und sauber, mit Tee und Kaffee zum Frühstück und einem angenehmen Gartenbereich.'}
  ]
 },
 fr:{
  'Rossi Apartment':[
   {name:'Sarah',date:'2026',text:'L’appartement était spacieux, impeccable et très bien équipé. Nous avons beaucoup apprécié le parking fermé et l’arrêt de bus à seulement quelques minutes à pied. Alessio et Chiara étaient chaleureux, accueillants et toujours disponibles.'},
   {name:'Giuseppe',date:'juillet 2025',text:'Nous avons passé un excellent séjour. L’arrêt de bus pour Venise et le supermarché sont juste à côté. L’appartement dispose de tout le nécessaire et est très bien équipé.'},
   {name:'P (Som)',date:'octobre 2025',text:'Un appartement charmant et spacieux, particulièrement pratique si vous voyagez en voiture. Rejoindre Venise en bus était très facile. Chiara s’est montrée très disponible et nous a accueillis en personne.'}
  ],
  'Dimora Castelli':[
   {name:'Semra',date:'mars 2026',text:'La maison était facile à trouver et l’arrêt de bus est tout près. Nous avons rejoint le centre de Venise en environ 15 minutes. Nous nous sommes sentis comme chez nous et le parking juste devant l’entrée était très pratique.'},
   {name:'Marwa',date:'janvier 2026',text:'Venise est facilement accessible en bus et en train. L’appartement est propre, spacieux et les lits sont confortables. L’accueil était chaleureux, avec des informations utiles et de petites attentions de la part des hôtes.'},
   {name:'Lee',date:'avril 2026',text:'Alessio et Chiara connaissent très bien Venise et nous ont donné des conseils utiles pour nous orienter. L’appartement est très spacieux et propre, avec du thé et du café pour le petit-déjeuner et un agréable espace jardin.'}
  ]
 },
 es:{
  'Rossi Apartment':[
   {name:'Sarah',date:'2026',text:'El apartamento era amplio, impecable y estaba muy bien equipado. Agradecimos mucho el aparcamiento cerrado y la parada de autobús a pocos minutos a pie. Alessio y Chiara fueron amables, acogedores y siempre disponibles.'},
   {name:'Giuseppe',date:'julio de 2025',text:'Tuvimos una estancia fantástica. La parada de autobús para Venecia y el supermercado están a la vuelta de la esquina. El apartamento tiene todo lo necesario y está muy bien equipado.'},
   {name:'P (Som)',date:'octubre de 2025',text:'Un apartamento precioso y espacioso, especialmente cómodo si viajas en coche. Llegar a Venecia en autobús fue muy fácil. Chiara fue muy atenta y nos recibió personalmente.'}
  ],
  'Dimora Castelli':[
   {name:'Semra',date:'marzo de 2026',text:'Fue muy fácil llegar a la casa y la parada de autobús está muy cerca. Pudimos llegar al centro de Venecia en unos 15 minutos. Nos sentimos como en casa y el aparcamiento justo en la entrada fue muy cómodo.'},
   {name:'Marwa',date:'enero de 2026',text:'Venecia se alcanza fácilmente en autobús y tren. El apartamento está limpio, es amplio y las camas son cómodas. La bienvenida fue muy cálida, con información útil y pequeños detalles por parte de los anfitriones.'},
   {name:'Lee',date:'abril de 2026',text:'Alessio y Chiara conocen muy bien Venecia y nos dieron información muy útil para orientarnos. El apartamento es muy amplio y limpio, con té y café para el desayuno y una agradable zona de jardín.'}
  ]
 },
 zh:{
  'Rossi Apartment':[
   {name:'Sarah',date:'2026年',text:'公寓宽敞、非常干净，而且设施齐全。我们很喜欢封闭式私人停车位，公交站步行几分钟就能到。Alessio 和 Chiara 热情友好，也一直都能及时提供帮助。'},
   {name:'Giuseppe',date:'2025年7月',text:'我们的住宿体验非常棒。前往威尼斯的公交站和超市就在附近，公寓设备齐全，日常所需一应俱全。'},
   {name:'P (Som)',date:'2025年10月',text:'公寓很漂亮也很宽敞，尤其适合自驾旅行。乘公交去威尼斯非常方便。Chiara 非常热心，并亲自迎接了我们。'}
  ],
  'Dimora Castelli':[
   {name:'Semra',date:'2026年3月',text:'公寓很好找，公交站也非常近。大约15分钟就能到威尼斯市中心。住在这里很有家的感觉，入口旁边的停车位尤其方便。'},
   {name:'Marwa',date:'2026年1月',text:'乘公交或火车前往威尼斯都很方便。公寓干净宽敞，床也很舒适。房东的接待很热情，还提供了很多实用信息和贴心小细节。'},
   {name:'Lee',date:'2026年4月',text:'Alessio 和 Chiara 非常熟悉威尼斯，给了我们很多实用的出行建议。公寓宽敞干净，还准备了早餐用的茶和咖啡，并有舒适的花园空间。'}
  ]
 }
};

'''
          replace_once(
              'components/LocalizedRich.tsx',
              "export type ApartmentData={name:string;subtitle:string;hero:string;heroAlt:string;guests:string;stats:[string,string,string][];gallery:[string,string][];livingTitle:string;living:string[];services:string[];transportTitle:string;transportText:string;transportHref:string;transportLabel:string;cta:string;message:string};\n",
              reviews + "export type ApartmentData={name:string;subtitle:string;hero:string;heroAlt:string;guests:string;stats:[string,string,string][];gallery:[string,string][];livingTitle:string;living:string[];services:string[];transportTitle:string;transportText:string;transportHref:string;transportLabel:string;cta:string;message:string};\n",
          )
          replace_once(
              'components/LocalizedRich.tsx',
              '  <section className="py-24"><div className="mx-auto max-w-5xl px-5 text-center lg:px-8"><p className="text-xs font-black uppercase tracking-[.22em] text-gold">{ui.contact}</p>',
              '  <ReviewSection property={data.name} reviews={localizedApartmentReviews[lang][data.name]||[]} lang={lang}/>\n  <section className="py-24"><div className="mx-auto max-w-5xl px-5 text-center lg:px-8"><p className="text-xs font-black uppercase tracking-[.22em] text-gold">{ui.contact}</p>',
          )

          # 3) Gondola prices: reduce only mobile size, keep desktop hierarchy.
          replace_once(
              'components/GondolaTourGuide.tsx',
              'mt-5 font-serif text-6xl text-navy',
              'mt-5 font-serif text-5xl text-navy sm:text-6xl',
          )
          replace_once(
              'components/GondolaTourGuide.tsx',
              'mt-5 font-serif text-6xl">{c.nightPrice}',
              'mt-5 font-serif text-5xl sm:text-6xl">{c.nightPrice}',
          )

          # 4) Italian Discover Venice: add evening service and frequencies.
          replace_once(
              'app/scopri-venezia/page.tsx',
              'Dagli appartamenti puoi raggiungere Piazzale Roma con le linee diurne 6 e 6L e rientrare anche di notte con la N2. In alternativa, Venezia Santa Lucia è raggiungibile in treno dalla stazione di Venezia Mestre.',
              'Dagli appartamenti puoi raggiungere Piazzale Roma con le linee 6 e 6L di giorno, continuare con la linea 6 la sera e rientrare anche di notte con la N2. In alternativa, Venezia Santa Lucia è raggiungibile in treno dalla stazione di Venezia Mestre.',
          )
          replace_once(
              'app/scopri-venezia/page.tsx',
              "              ['Di giorno','6 · 6L','Marghera → Piazzale Roma'],\n              ['Di notte','N2','Rientro da Venezia verso Marghera'],\n              ['In treno','Mestre → Santa Lucia','Corse regionali frequenti'],",
              "              ['Di giorno','6 · 6L','Ogni 10 minuti · Marghera → Piazzale Roma'],\n              ['Di sera','6','Ogni 20 minuti · Marghera → Piazzale Roma'],\n              ['Di notte','N2','Ogni 30 minuti · Rientro da Venezia verso Marghera'],\n              ['In treno','Mestre → Santa Lucia','Corse regionali frequenti'],",
          )

          # 6) English Discover Venice: use the same compact mobile hub as IT and fix transport schedule.
          replace_once(
              'app/en/discover-venice/page.tsx',
              '<section id="choose" className="bg-cream py-20"><div className="mx-auto max-w-7xl px-5 lg:px-8"><SectionTitle eyebrow="Explore by interest" title="What kind of Venice do you want to experience?" text="Art, islands, family, pets, events or transport: jump straight to the guide you actually need."/><div className="mt-10 border-y border-navy/15">{hub.map(([n,title,text,href])=><Link key={n} href={href} className="group grid gap-3 border-b border-navy/10 py-6 last:border-0 md:grid-cols-[72px_1fr_auto] md:items-center"><span className="font-serif text-3xl text-gold">{n}</span><span><strong className="block font-serif text-3xl text-navy transition group-hover:text-gold">{title}</strong><span className="mt-1 block max-w-3xl text-slate-600">{text}</span></span><span className="text-2xl text-gold">→</span></Link>)}</div></div></section>',
              '<section id="choose" className="py-16 sm:py-20"><div className="mx-auto max-w-7xl px-5 lg:px-8"><SectionTitle eyebrow="Explore by interest" title="What kind of Venice do you want to experience?" text="Art, islands, family, pets, events or transport: jump straight to the guide you actually need."/><div className="mt-8 grid border-y border-navy/15 md:grid-cols-2">{hub.map(([n,title,text,href],i)=><Link key={n} href={href} className={`group grid grid-cols-[42px_1fr_auto] gap-3 py-6 transition hover:bg-cream md:px-6 ${i%2===0?\'md:border-r md:border-navy/10\':\'\'} ${i<4?\'border-b border-navy/10\':\'\'}`}><span className="pt-1 text-xs font-black tracking-[.16em] text-gold">{n}</span><span><strong className="block font-serif text-2xl font-normal text-navy transition group-hover:text-gold">{title}</strong><span className="mt-2 block max-w-xl leading-7 text-slate-600">{text}</span></span><span className="pt-1 text-2xl text-gold transition group-hover:translate-x-1">→</span></Link>)}</div></div></section>',
          )
          replace_once(
              'app/en/discover-venice/page.tsx',
              '<div className="border-y border-slate-200">{[[\'6 / 6L\',\'Daytime buses to Venezia – Piazzale Roma\'],[\'N2\',\'Night connection between Venice and Marghera\'],[\'Train\',\'Venezia Mestre → Venezia Santa Lucia\']].map(([title,text])=><div key={title} className="grid gap-2 border-b border-slate-200 py-5 last:border-0 sm:grid-cols-[130px_1fr]"><strong className="font-serif text-2xl text-navy">{title}</strong><span className="text-slate-600">{text}</span></div>)}</div>',
              '<div className="border-y border-slate-200">{[[\'Daytime\',\'6 · 6L\',\'Every 10 minutes · Marghera → Piazzale Roma\'],[\'Evening\',\'6\',\'Every 20 minutes · Marghera → Piazzale Roma\'],[\'Night\',\'N2\',\'Every 30 minutes · Venice → Marghera\'],[\'Train\',\'Mestre → Santa Lucia\',\'Frequent regional trains\']].map(([period,line,text])=><div key={period} className="grid grid-cols-[88px_1fr] gap-4 border-b border-slate-200 py-5 last:border-0"><span className="text-xs font-black uppercase tracking-[.14em] text-gold">{period}</span><span><strong className="block text-navy">{line}</strong><span className="mt-1 block text-sm text-slate-600">{text}</span></span></div>)}</div>',
          )

          # 4) DE / FR / ES / ZH Discover Venice: explicit service schedule instead of unrelated journey steps.
          schedule = r'''const veniceTransitSchedule:Record<ParityLang,[string,string,string,string][]>={
 de:[
  ['Tagsüber','6 · 6L','Alle 10 Minuten','Marghera → Piazzale Roma'],
  ['Abends','6','Alle 20 Minuten','Marghera → Piazzale Roma'],
  ['Nachts','N2','Alle 30 Minuten','Venedig → Marghera'],
  ['Mit dem Zug','Mestre → Santa Lucia','Häufige Regionalzüge','']
 ],
 fr:[
  ['En journée','6 · 6L','Toutes les 10 minutes','Marghera → Piazzale Roma'],
  ['Le soir','6','Toutes les 20 minutes','Marghera → Piazzale Roma'],
  ['La nuit','N2','Toutes les 30 minutes','Venise → Marghera'],
  ['En train','Mestre → Santa Lucia','Trains régionaux fréquents','']
 ],
 es:[
  ['De día','6 · 6L','Cada 10 minutos','Marghera → Piazzale Roma'],
  ['Por la tarde','6','Cada 20 minutos','Marghera → Piazzale Roma'],
  ['De noche','N2','Cada 30 minutos','Venecia → Marghera'],
  ['En tren','Mestre → Santa Lucia','Trenes regionales frecuentes','']
 ],
 zh:[
  ['白天','6 · 6L','每10分钟一班','Marghera → Piazzale Roma'],
  ['晚间','6','每20分钟一班','Marghera → Piazzale Roma'],
  ['夜间','N2','每30分钟一班','威尼斯 → Marghera'],
  ['火车','Mestre → Santa Lucia','区域列车班次频繁','']
 ]
};

'''
          replace_once(
              'components/LocalizedParityPages.tsx',
              '\nexport function LocalizedDiscoverVeniceFull({lang,data}:{lang:ParityLang;data:VeniceData}){\n const u=discoverHubUi[lang];',
              '\n' + schedule + 'export function LocalizedDiscoverVeniceFull({lang,data}:{lang:ParityLang;data:VeniceData}){\n const u=discoverHubUi[lang];\n const schedule=veniceTransitSchedule[lang];',
          )
          replace_once(
              'components/LocalizedParityPages.tsx',
              '<div className="self-start border-y border-navy/15">{data.transport.steps.slice(0,3).map(([n,t,x])=><div key={n} className="grid grid-cols-[42px_1fr] gap-4 border-b border-navy/10 py-5 last:border-b-0"><span className="text-xs font-black tracking-[.14em] text-gold">{n}</span><span><strong className="block text-navy">{t}</strong><span className="mt-1 block text-sm text-slate-600">{x}</span></span></div>)}</div>',
              '<div className="self-start border-y border-navy/15">{schedule.map(([period,line,frequency,note])=><div key={period} className="grid grid-cols-[88px_1fr] gap-4 border-b border-navy/10 py-5 last:border-b-0"><span className="text-xs font-black uppercase tracking-[.14em] text-gold">{period}</span><span><strong className="block text-navy">{line}</strong><span className="mt-1 block text-sm text-slate-600">{frequency}</span>{note&&<span className="mt-1 block text-sm text-slate-500">{note}</span>}</span></div>)}</div>',
          )

          # 5) Chinese private Welcome Books: searchable WeChat ID for same-device users.
          for path in ['public/guest-content/rossi/zh.html','public/guest-content/dimora-castelli/zh.html']:
              text = read(path)
              if 'MargheraVenice' in text:
                  raise SystemExit(f'{path}: WeChat ID already present unexpectedly')
              pattern = r'(<div class="help"><div><strong>需要帮助？</strong><small>.*?</small>)(</div><a class="btn primary")'
              text2, count = re.subn(pattern, r'\1<small><b>微信 ID：</b>MargheraVenice</small>\2', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: help block match count {count}')
              write(path, text2)

          print('All mobile multilingual patches applied successfully.')
          PY

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Header.tsx components/LocalizedRich.tsx components/GondolaTourGuide.tsx app/scopri-venezia/page.tsx app/en/discover-venice/page.tsx components/LocalizedParityPages.tsx public/guest-content/rossi/zh.html public/guest-content/dimora-castelli/zh.html
          git diff --cached --check
          git commit -m "Fix multilingual mobile parity issues"
          git push origin HEAD:mobile-multilingual-polish-20260912
