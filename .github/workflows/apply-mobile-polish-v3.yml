name: Apply mobile multilingual polish v3

on:
  push:
    branches:
      - mobile-multilingual-polish-20260912
    paths:
      - .github/workflows/apply-mobile-polish-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-multilingual-polish-20260912
          fetch-depth: 0
      - name: Apply verified source edits
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Header.tsx components/LocalizedRich.tsx components/GondolaTourGuide.tsx app/scopri-venezia/page.tsx app/en/discover-venice/page.tsx components/LocalizedParityPages.tsx public/guest-content/rossi/zh.html public/guest-content/dimora-castelli/zh.html
          git diff --cached --check
          git commit -m "Fix multilingual mobile parity issues"
          git push origin HEAD:mobile-multilingual-polish-20260912
