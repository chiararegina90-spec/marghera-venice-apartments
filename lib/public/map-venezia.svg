<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Mappa illustrata di Venezia e della laguna</title>
<desc id="desc">Mappa stilizzata con Piazzale Roma, Rialto, San Marco, Accademia, Arsenale, Murano, Burano, Lido e Pellestrina.</desc>
<defs>
  <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#dceff2"/><stop offset="1" stop-color="#9bc9d0"/>
  </linearGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f7edcf"/><stop offset="1" stop-color="#dfd0a3"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#08283f" flood-opacity=".15"/>
  </filter>
  <pattern id="waves" width="70" height="28" patternUnits="userSpaceOnUse">
    <path d="M0 17c18-12 36-12 54 0s36 12 54 0" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
  </pattern>
</defs>
<rect width="1500" height="900" rx="40" fill="url(#water)"/>
<rect width="1500" height="900" rx="40" fill="url(#waves)"/>

<!-- mainland -->
<path d="M0 0H380C360 150 380 260 345 350C310 445 250 500 240 630C230 735 260 810 290 900H0Z" fill="#d8dfc7"/>

<!-- Venice fish -->
<path d="M470 470
C540 420 610 380 690 375
C770 370 850 390 930 430
C1005 468 1045 520 1038 565
C1030 610 990 650 925 665
C852 682 790 655 720 640
C650 625 585 640 525 625
C470 612 430 570 430 530
C430 505 445 485 470 470Z" fill="url(#land)" filter="url(#shadow)"/>

<!-- Grand Canal -->
<path d="M495 535C575 470 665 452 742 478C815 503 840 557 905 573C953 585 986 573 1020 555"
fill="none" stroke="#6bb2bd" stroke-width="30" stroke-linecap="round"/>
<path d="M500 540C580 478 660 468 735 490C804 510 840 565 902 580C947 591 982 579 1016 560"
fill="none" stroke="#dff4f5" stroke-width="10" stroke-linecap="round"/>

<!-- islands -->
<g fill="url(#land)" filter="url(#shadow)">
  <path d="M790 210c65-38 142-35 205 8-50 50-126 73-192 52-43-14-50-39-13-60Z"/>
  <path d="M1120 135c58-22 120-13 165 25-50 36-108 51-160 31-31-12-30-42-5-56Z"/>
  <path d="M1100 595c95-24 195-4 270 50-90 32-182 41-267 14-47-15-47-50-3-64Z"/>
  <path d="M1165 730c80-12 160 13 220 52-72 22-148 26-218 3-40-13-37-47-2-55Z"/>
</g>

<!-- routes -->
<g fill="none" stroke="#c69e56" stroke-width="5" stroke-dasharray="13 12" opacity=".9">
  <path d="M305 520C360 525 405 528 455 528"/>
  <path d="M730 410C760 330 800 285 850 245"/>
  <path d="M935 430C1030 365 1090 290 1160 190"/>
  <path d="M990 565C1080 590 1140 620 1200 650"/>
  <path d="M1200 650C1220 700 1240 750 1280 790"/>
</g>

<!-- labels -->
<g font-family="Arial, sans-serif" fill="#09283f">
  <g transform="translate(305 520)">
    <circle r="12" fill="#c69e56" stroke="#fff" stroke-width="5"/>
    <rect x="-110" y="-58" width="220" height="42" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="0" y="-30" text-anchor="middle" font-size="21" font-weight="700">PIAZZALE ROMA</text>
  </g>

  <g transform="translate(610 505)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="-70" y="-58" width="140" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="0" y="-31" text-anchor="middle" font-size="20" font-weight="700">RIALTO</text>
  </g>

  <g transform="translate(760 570)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="-82" y="20" width="164" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="0" y="47" text-anchor="middle" font-size="20" font-weight="700">ACCADEMIA</text>
  </g>

  <g transform="translate(940 545)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="-80" y="-58" width="160" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="0" y="-31" text-anchor="middle" font-size="20" font-weight="700">SAN MARCO</text>
  </g>

  <g transform="translate(1010 490)">
    <circle r="10" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="20" y="-20" width="125" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="82" y="7" text-anchor="middle" font-size="19" font-weight="700">ARSENALE</text>
  </g>

  <g transform="translate(855 245)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="-75" y="-58" width="150" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="0" y="-31" text-anchor="middle" font-size="20" font-weight="700">MURANO</text>
  </g>

  <g transform="translate(1170 190)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="-75" y="-58" width="150" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="0" y="-31" text-anchor="middle" font-size="20" font-weight="700">BURANO</text>
  </g>

  <g transform="translate(1210 645)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="18" y="-20" width="105" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="70" y="7" text-anchor="middle" font-size="20" font-weight="700">LIDO</text>
  </g>

  <g transform="translate(1290 790)">
    <circle r="11" fill="#09283f" stroke="#fff" stroke-width="4"/>
    <rect x="-160" y="20" width="160" height="40" rx="12" fill="#fff" stroke="#d8cfbf"/>
    <text x="-80" y="47" text-anchor="middle" font-size="19" font-weight="700">PELLESTRINA</text>
  </g>
</g>

<!-- simple landmark icons -->
<g stroke="#c69e56" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M915 520v-65m-20 65h40m-30-65l10-30 10 30"/>
  <path d="M595 475c20-25 40-25 60 0m-50 0h40"/>
  <path d="M820 215c20-25 40-25 60 0m-50 0h40"/>
  <path d="M1140 160c22-26 44-26 66 0m-55 0h44"/>
</g>

<!-- legend -->
<g transform="translate(55 65)">
  <rect width="420" height="175" rx="26" fill="#fff" opacity=".94" filter="url(#shadow)"/>
  <text x="30" y="55" font-family="Georgia, serif" font-size="42" fill="#09283f">Venezia e la laguna</text>
  <text x="30" y="96" font-family="Arial, sans-serif" font-size="21" fill="#65737b">Luoghi iconici, isole e itinerari sull'acqua.</text>
  <text x="30" y="133" font-family="Arial, sans-serif" font-size="18" fill="#8a7653">Mappa illustrativa, non in scala.</text>
</g>
</svg>